limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.vegetask.net$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name vegetask.net;

    ssl_certificate     /etc/letsencrypt/live/www.vegetask.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.vegetask.net/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://www.vegetask.net$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name www.vegetask.net;

    ssl_certificate     /etc/letsencrypt/live/www.vegetask.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.vegetask.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/login {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://back-end:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/signup {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://back-end:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://back-end:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
